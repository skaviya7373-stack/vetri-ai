
{% extends 'base.html' %}

{% block content %}

<div class="hero fade">

    <h1>📅 AI Study Plan Generator</h1>

    <p>
        Generate a personalized AI-powered study plan for your chosen topic.
    </p>

    <form method="POST">

        {% csrf_token %}

        <input
            type="text"
            name="topic"
            value="{{ topic }}"
            placeholder="Enter Topic (Example: Python, DBMS)"
            required>

        <button type="submit">
            🚀 Generate Study Plan
        </button>

    </form>

</div>

<hr>

{% if content %}

<h2>📅 Your AI Study Plan</h2>

<div id="ai-content" class="history-card fade">

    <pre>{{ content }}</pre>

</div>

<br>

<button
    class="copy-btn"
    onclick="copyContent()">
    📋 Copy Study Plan
</button>

<button
    class="download-btn"
    onclick="downloadPDF()">
    📄 Download PDF
</button>

{% endif %}

{% endblock %}
