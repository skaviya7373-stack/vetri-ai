{% extends 'base.html' %}

{% block content %}

<div class="hero fade">

    <h1>🔐 Login</h1>

    <p>
        Login to access Vetri AI Study Buddy.
    </p>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            🔐 Login
        </button>

    </form>

    <br>

    <p>
        Don't have an account?
        <a href="/register/"><b>Register Here</b></a>
    </p>

</div>

{% endblock %}
